name: Apply inventory majority-N singleton repair

on:
  push:
    branches:
      - fix/inventory-majority-n-singletons
    paths:
      - '.github/workflows/apply-inventory-majority-n-singletons.yml'

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/inventory-majority-n-singletons

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mj-insight-vault-mvp/mj-insight-vault/package-lock.json

      - name: Apply exact repair
        run: python3 scripts/apply-inventory-majority-n-singletons.py

      - name: Install exact dependencies
        working-directory: mj-insight-vault-mvp/mj-insight-vault
        run: npm ci

      - name: Production dependency audit
        working-directory: mj-insight-vault-mvp/mj-insight-vault
        run: npm audit --omit=dev --audit-level=moderate

      - name: Lint
        working-directory: mj-insight-vault-mvp/mj-insight-vault
        run: npm run lint

      - name: Local regression suite
        working-directory: mj-insight-vault-mvp/mj-insight-vault
        run: npm run test:local

      - name: Production build
        working-directory: mj-insight-vault-mvp/mj-insight-vault
        run: npm run build

      - name: Commit verified repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            mj-insight-vault-mvp/mj-insight-vault/lib/articleInventoryWorkerV5Consensus.ts \
            mj-insight-vault-mvp/mj-insight-vault/scripts/verify-inventory-majority-n-singletons.mjs \
            mj-insight-vault-mvp/mj-insight-vault/package.json
          git diff --cached --quiet && exit 1
          git commit -m 'Honor explicit two-pass non-article majority'
          git push origin HEAD:fix/inventory-majority-n-singletons
