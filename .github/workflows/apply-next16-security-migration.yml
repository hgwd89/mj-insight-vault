name: Apply Next 16 security migration

on:
  push:
    branches:
      - security/next16-security-migration
    paths:
      - '.github/workflows/apply-next16-security-migration.yml'

permissions:
  contents: write

defaults:
  run:
    working-directory: mj-insight-vault-mvp/mj-insight-vault

jobs:
  migrate-test-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: security/next16-security-migration

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mj-insight-vault-mvp/mj-insight-vault/package-lock.json

      - name: Set Next 16 migration ranges
        run: |
          npm pkg set dependencies.next='^16.3.1'
          npm pkg set dependencies.sharp='^0.35.3'
          npm pkg set devDependencies.eslint-config-next='^16.3.1'

      - name: Resolve migrated lockfile
        run: npm install

      - name: Migrate ESLint config to native flat config
        shell: bash
        run: |
          cat > scripts/eslint.config.mjs <<'EOF'
          import { defineConfig, globalIgnores } from 'eslint/config';
          import nextVitals from 'eslint-config-next/core-web-vitals';
          import nextTs from 'eslint-config-next/typescript';

          export default defineConfig([
            ...nextVitals,
            ...nextTs,
            {
              rules: {
                'react-hooks/set-state-in-effect': 'off'
              }
            },
            globalIgnores([
              '.next/**',
              'out/**',
              'build/**',
              'node_modules/**',
              'next-env.d.ts',
              'tsconfig.tsbuildinfo'
            ])
          ]);
          EOF

      - name: Verify resolved framework stack
        run: npm ls next eslint-config-next react react-dom sharp postcss

      - name: Enforce production audit gate
        shell: bash
        run: |
          npm audit --omit=dev --json > /tmp/audit-prod.json || true
          node - <<'NODE'
          const fs = require('fs');
          const a = JSON.parse(fs.readFileSync('/tmp/audit-prod.json', 'utf8'));
          const v = a.metadata?.vulnerabilities || {};
          console.log('NEXT16_PRODUCTION_AUDIT=' + JSON.stringify(v));
          for (const [name, item] of Object.entries(a.vulnerabilities || {})) {
            console.log('NEXT16_PRODUCTION_VULNERABILITY=' + JSON.stringify({name,severity:item.severity,isDirect:item.isDirect,range:item.range,fixAvailable:item.fixAvailable}));
          }
          if ((v.high || 0) !== 0 || (v.critical || 0) !== 0) {
            console.error('Next 16 migration must not retain high or critical production vulnerabilities.');
            process.exit(1);
          }
          NODE

      - name: Lint
        run: npm run lint

      - name: Local regression suite
        run: npm run test:local

      - name: Production build
        run: npm run build

      - name: Assert migration scope
        working-directory: .
        shell: bash
        run: |
          python3 - <<'PY'
          import subprocess
          expected = {
              'mj-insight-vault-mvp/mj-insight-vault/package.json',
              'mj-insight-vault-mvp/mj-insight-vault/package-lock.json',
              'mj-insight-vault-mvp/mj-insight-vault/scripts/eslint.config.mjs',
          }
          changed = set(filter(None, subprocess.check_output(['git','diff','--name-only'], text=True).splitlines()))
          unexpected = changed - expected
          missing = expected - changed
          print('CHANGED_FILES=' + ','.join(sorted(changed)))
          if unexpected or missing:
              raise SystemExit(f'unexpected migration scope: unexpected={sorted(unexpected)} missing={sorted(missing)}')
          PY

      - name: Commit verified migration
        working-directory: .
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            mj-insight-vault-mvp/mj-insight-vault/package.json \
            mj-insight-vault-mvp/mj-insight-vault/package-lock.json \
            mj-insight-vault-mvp/mj-insight-vault/scripts/eslint.config.mjs
          git diff --cached --quiet && exit 1
          git commit -m 'Upgrade Next.js to 16.3.1 security baseline'
          git push origin HEAD:security/next16-security-migration
