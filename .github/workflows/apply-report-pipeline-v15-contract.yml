name: Apply report pipeline v15 contract repair

on:
  push:
    branches:
      - fix/report-pipeline-v15-contract
    paths:
      - '.github/workflows/apply-report-pipeline-v15-contract.yml'

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/report-pipeline-v15-contract

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mj-insight-vault-mvp/mj-insight-vault/package-lock.json

      - name: Update stale report-pipeline contract
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('mj-insight-vault-mvp/mj-insight-vault/scripts/verify-report-pipeline.mjs')
          s = p.read_text()
          old = "assertIncludes(jobsRoute, \"PIPELINE_VERSION = 'report_pipeline_v3'\", 'new jobs must be versioned');"
          new = "assertIncludes(jobsRoute, \"PIPELINE_VERSION = 'verified_report_pipeline_v15'\", 'new jobs must use the verified report pipeline version');"
          assert s.count(old) == 1, 'report pipeline version assertion drifted'
          p.write_text(s.replace(old, new, 1))
          PY

      - name: Install dependencies
        working-directory: mj-insight-vault-mvp/mj-insight-vault
        run: npm ci

      - name: Lint
        working-directory: mj-insight-vault-mvp/mj-insight-vault
        run: npm run lint

      - name: Local regression suite
        working-directory: mj-insight-vault-mvp/mj-insight-vault
        run: npm run test:local

      - name: Production build
        working-directory: mj-insight-vault-mvp/mj-insight-vault
        run: npm run build

      - name: Commit verified contract repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mj-insight-vault-mvp/mj-insight-vault/scripts/verify-report-pipeline.mjs
          git diff --cached --quiet && exit 1
          git commit -m 'Align report pipeline contract with v15'
          git push origin HEAD:fix/report-pipeline-v15-contract
