name: Apply semantic evidence and final writer

on:
  push:
    branches: [main]
    paths:
      - '.github/trigger-semantic-evidence-final-writer-v2'

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: mj-insight-vault-mvp/mj-insight-vault/package-lock.json
      - name: Apply semantic evidence and writer patch
        run: |
          python3 scripts/fix_semantic_patch_escaping.py
          python3 scripts/patch_semantic_evidence_and_final_writer.py
      - name: Install dependencies
        working-directory: mj-insight-vault-mvp/mj-insight-vault
        run: npm ci
      - name: Regression tests
        working-directory: mj-insight-vault-mvp/mj-insight-vault
        run: npm run test:local
      - name: Lint
        working-directory: mj-insight-vault-mvp/mj-insight-vault
        run: npm run lint
      - name: Production build
        working-directory: mj-insight-vault-mvp/mj-insight-vault
        run: npm run build
      - name: Commit verified fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mj-insight-vault-mvp/mj-insight-vault/lib/chatRouteFullCorpusGuard.ts \
                  mj-insight-vault-mvp/mj-insight-vault/lib/chatAnalysisQualityGate.ts \
                  mj-insight-vault-mvp/mj-insight-vault/scripts/verify-report-pipeline.mjs
          git diff --cached --quiet && exit 1
          git commit -m 'enforce semantic evidence and concise final writer'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
