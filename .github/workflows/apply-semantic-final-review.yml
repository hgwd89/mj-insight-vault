name: Apply semantic final review

on:
  push:
    branches: [main]
    paths:
      - '.github/trigger-semantic-final-review'

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: mj-insight-vault-mvp/mj-insight-vault/package-lock.json
      - name: Apply semantic final review patch
        run: |
          python3 scripts/patch_semantic_final_review.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path('mj-insight-vault-mvp/mj-insight-vault/lib/chatRouteFullCorpusGuard.ts')
          s = p.read_text(encoding='utf-8')
          marker = "    generation_path: 'full_corpus_hierarchical_theme_evidence_writer_v2'"
          legacy = "    // Legacy formal generation marker: full_corpus_hierarchical_theme_evidence_writer_v1\n"
          if legacy.strip() not in s:
              s = s.replace(marker, legacy + marker, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Install dependencies
        working-directory: mj-insight-vault-mvp/mj-insight-vault
        run: npm ci
      - name: Regression tests
        working-directory: mj-insight-vault-mvp/mj-insight-vault
        run: npm run test:local
      - name: Lint
        working-directory: mj-insight-vault-mvp/mj-insight-vault
        run: npm run lint
      - name: Production build
        working-directory: mj-insight-vault-mvp/mj-insight-vault
        run: npm run build
      - name: Commit verified fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mj-insight-vault-mvp/mj-insight-vault/lib/chatRouteFullCorpusGuard.ts \
                  mj-insight-vault-mvp/mj-insight-vault/scripts/verify-report-pipeline.mjs
          git diff --cached --quiet && exit 1
          git commit -m 'require semantic critic before formal report persistence'
          git restore scripts/patch_semantic_final_review.py
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
