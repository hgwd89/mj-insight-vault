name: Apply Supabase IO budget hardening

on:
  push:
    branches:
      - fix/supabase-io-budget-hardening
    paths:
      - '.github/workflows/apply-supabase-io-budget-hardening.yml'

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout hardening branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/supabase-io-budget-hardening

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mj-insight-vault-mvp/mj-insight-vault/package-lock.json

      - name: Bound completed job result payloads
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path('mj-insight-vault-mvp/mj-insight-vault')
          runner = root / 'app/api/chat/jobs/[id]/run/route.ts'
          s = runner.read_text()

          old = """function reportIdFromResult(result: unknown) {
  if (!isRecord(result) || !isRecord(result.report)) return '';
  return text(result.report.id);
}
"""
          new = """function reportIdFromResult(result: unknown) {
  if (!isRecord(result) || !isRecord(result.report)) return '';
  return text(result.report.id);
}

function compactCompletedJobResult(result: unknown, reportId: string) {
  const root = isRecord(result) ? result : {};
  const answer = isRecord(root.answer)
    ? root.answer
    : isRecord(root.answer_json)
      ? root.answer_json
      : {};
  const answerText = text(answer.answer_text || root.answer_text || answer.summary || answer.report_title);
  return {
    answer: {
      report_title: text(answer.report_title) || 'レポート',
      answer_text: answerText.slice(0, 180)
    },
    report: { id: reportId }
  };
}
"""
          assert s.count(old) == 1, 'reportIdFromResult insertion point drifted'
          s = s.replace(old, new, 1)

          old_saved = "        result_json: { recovered_report: savedReport },"
          new_saved = "        result_json: compactCompletedJobResult(savedReport, text(savedReport.id)),"
          assert s.count(old_saved) == 1, 'saved report result payload target drifted'
          s = s.replace(old_saved, new_saved, 1)

          old_completed = "        result_json: result,\n        report_id: reportId,"
          new_completed = "        result_json: compactCompletedJobResult(result, reportId),\n        report_id: reportId,"
          assert s.count(old_completed) == 1, 'completed result payload target drifted'
          s = s.replace(old_completed, new_completed, 1)
          runner.write_text(s)

          verify = root / 'scripts/verify-report-pipeline.mjs'
          v = verify.read_text()
          marker = "assertIncludes(runner, 'pipelineSnapshot', 'job state must persist bounded pipeline diagnostics');"
          addition = marker + "\nassertIncludes(runner, 'compactCompletedJobResult', 'completed report jobs must keep only a bounded UI payload');\nassertIncludes(runner, 'result_json: compactCompletedJobResult(result, reportId)', 'new completed jobs must not duplicate the full formal report in chat_jobs');\nassertIncludes(runner, 'result_json: compactCompletedJobResult(savedReport, text(savedReport.id))', 'recovered completed jobs must also keep a bounded payload');"
          assert v.count(marker) == 1, 'verify-report-pipeline insertion point drifted'
          verify.write_text(v.replace(marker, addition, 1))
          PY

      - name: Install dependencies
        working-directory: mj-insight-vault-mvp/mj-insight-vault
        run: npm ci

      - name: Lint
        working-directory: mj-insight-vault-mvp/mj-insight-vault
        run: npm run lint

      - name: Local regression suite
        working-directory: mj-insight-vault-mvp/mj-insight-vault
        run: npm run test:local

      - name: Production build
        working-directory: mj-insight-vault-mvp/mj-insight-vault
        run: npm run build

      - name: Commit verified application hardening
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            mj-insight-vault-mvp/mj-insight-vault/app/api/chat/jobs/[id]/run/route.ts \
            mj-insight-vault-mvp/mj-insight-vault/scripts/verify-report-pipeline.mjs
          git diff --cached --quiet && exit 1
          git commit -m 'Bound completed report job payloads'
          git push origin HEAD:fix/supabase-io-budget-hardening
