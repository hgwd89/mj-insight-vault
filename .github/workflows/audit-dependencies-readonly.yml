name: Dependency vulnerability audit (read-only)

on:
  push:
    branches:
      - audit/dependency-vulnerabilities
    paths:
      - '.github/workflows/audit-dependencies-readonly.yml'

permissions:
  contents: read

defaults:
  run:
    working-directory: mj-insight-vault-mvp/mj-insight-vault

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mj-insight-vault-mvp/mj-insight-vault/package-lock.json

      - name: Install exact lockfile
        run: npm ci

      - name: Audit production dependencies
        shell: bash
        run: |
          npm audit --omit=dev --json > /tmp/audit-prod.json || true
          node - <<'NODE'
          const fs = require('fs');
          const a = JSON.parse(fs.readFileSync('/tmp/audit-prod.json', 'utf8'));
          console.log('PRODUCTION_AUDIT_METADATA=' + JSON.stringify(a.metadata?.vulnerabilities || {}));
          for (const [name, v] of Object.entries(a.vulnerabilities || {})) {
            const via = (v.via || []).map(x => typeof x === 'string' ? x : ({title:x.title, url:x.url, severity:x.severity, range:x.range}));
            console.log('PRODUCTION_VULNERABILITY=' + JSON.stringify({name, severity:v.severity, isDirect:v.isDirect, range:v.range, via, effects:v.effects, fixAvailable:v.fixAvailable}));
          }
          NODE

      - name: Audit all dependencies
        shell: bash
        run: |
          npm audit --json > /tmp/audit-all.json || true
          node - <<'NODE'
          const fs = require('fs');
          const a = JSON.parse(fs.readFileSync('/tmp/audit-all.json', 'utf8'));
          console.log('ALL_AUDIT_METADATA=' + JSON.stringify(a.metadata?.vulnerabilities || {}));
          for (const [name, v] of Object.entries(a.vulnerabilities || {})) {
            const via = (v.via || []).map(x => typeof x === 'string' ? x : ({title:x.title, url:x.url, severity:x.severity, range:x.range}));
            console.log('ALL_VULNERABILITY=' + JSON.stringify({name, severity:v.severity, isDirect:v.isDirect, range:v.range, via, effects:v.effects, fixAvailable:v.fixAvailable}));
          }
          NODE
