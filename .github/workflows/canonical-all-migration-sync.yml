name: canonical-all-migration-sync

on:
  push:
    branches:
      - chore/canonical-migration-sync-20260809

permissions:
  contents: write

jobs:
  sync:
    if: ${{ !contains(github.event.head_commit.message, '[all-sync-done]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch and verify all 310 canonical migrations
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            -X POST 'https://wqbjtvepnavkqdshppau.supabase.co/rest/v1/rpc/_mj_git_export_310_8c1d2f5a' \
            -H 'apikey: sb_publishable_Y0eb0AT-U8M0Ho-_LMEtCQ_gUMBLyD7' \
            -H 'Content-Type: application/json' \
            --data '{}' > /tmp/canonical_export.json
          python3 - <<'PY'
          import glob, json, os, subprocess, sys
          with open('/tmp/canonical_export.json', encoding='utf-8') as f:
              rows = json.load(f)
          if not isinstance(rows, list) or len(rows) != 310:
              raise SystemExit(f'export must contain 310 rows, got {type(rows)} {len(rows) if isinstance(rows,list) else "n/a"}')
          expected = {}
          for row in rows:
              path = row['path']
              sha = row['sha']
              content = row['content']
              if path in expected:
                  raise SystemExit(f'duplicate canonical path: {path}')
              expected[path] = sha
              os.makedirs(os.path.dirname(path), exist_ok=True)
              with open(path, 'w', encoding='utf-8', newline='') as out:
                  out.write(content)
              actual = subprocess.check_output(['git','hash-object',path], text=True).strip()
              if actual != sha:
                  raise SystemExit(f'SHA mismatch after write: {path} expected={sha} actual={actual}')
          actual_paths = set(glob.glob('supabase/migrations/*.sql'))
          extra = sorted(actual_paths - set(expected))
          missing = sorted(set(expected) - actual_paths)
          if missing:
              raise SystemExit('missing after canonical write:\n' + '\n'.join(missing))
          print(f'CANONICAL_WRITTEN_AND_HASHED {len(expected)}/310')
          print(f'EXTRA_EXISTING_PATHS {len(extra)}')
          for p in extra:
              print('EXTRA', p)
          PY
      - name: Commit all canonical migration files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabase/migrations/*.sql
          git diff --cached --quiet && { echo 'NO_MIGRATION_CHANGES'; exit 0; }
          git commit -m 'chore: sync all 310 canonical migrations [all-sync-done]'
          git push origin HEAD:chore/canonical-migration-sync-20260809
