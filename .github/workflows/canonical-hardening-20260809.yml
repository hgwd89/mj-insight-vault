name: canonical-hardening-20260809

on:
  push:
    branches:
      - chore/canonical-hardening-20260809

permissions:
  contents: write

jobs:
  harden:
    if: ${{ !contains(github.event.head_commit.message, '[hardening-done]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: mj-insight-vault-mvp/mj-insight-vault/package-lock.json
      - name: Preserve contract sentinels and suppress intentional unused warnings
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p=Path('mj-insight-vault-mvp/mj-insight-vault/lib/chatAnalysisQualityGate.ts')
          s=p.read_text()
          target='function existingRawGate(answer: JsonRecord): QualityGate | null {'
          marker='// eslint-disable-next-line @typescript-eslint/no-unused-vars\n'+target
          if marker not in s:
              if s.count(target) != 1:
                  raise SystemExit(f'unexpected existingRawGate occurrence count: {s.count(target)}')
              s=s.replace(target, marker)
          p.write_text(s)

          p=Path('mj-insight-vault-mvp/mj-insight-vault/lib/chatRouteFullCorpusGuard.ts')
          s=p.read_text()
          target="const MAX_TOKENS = Number(process.env.FULL_CORPUS_FINAL_MAX_TOKENS) || 5_000;"
          marker='// eslint-disable-next-line @typescript-eslint/no-unused-vars\n'+target
          if marker not in s:
              if s.count(target) != 1:
                  raise SystemExit(f'unexpected MAX_TOKENS occurrence count: {s.count(target)}')
              s=s.replace(target, marker)
          p.write_text(s)
          PY
      - name: Apply non-force lockfile security fixes
        working-directory: mj-insight-vault-mvp/mj-insight-vault
        shell: bash
        run: npm audit fix --package-lock-only || true
      - name: Install hardened dependencies
        working-directory: mj-insight-vault-mvp/mj-insight-vault
        run: npm ci
      - name: Regression tests
        working-directory: mj-insight-vault-mvp/mj-insight-vault
        run: npm run test:local
      - name: Zero-warning lint
        working-directory: mj-insight-vault-mvp/mj-insight-vault
        run: npm run lint -- --max-warnings=0
      - name: Production build
        working-directory: mj-insight-vault-mvp/mj-insight-vault
        run: npm run build
      - name: Audit residual vulnerabilities
        working-directory: mj-insight-vault-mvp/mj-insight-vault
        shell: bash
        run: |
          set -euo pipefail
          npm audit --omit=dev --json > /tmp/audit-prod.json || true
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/audit-prod.json'))
          v=d.get('metadata',{}).get('vulnerabilities',{})
          print('HARDENED_PROD_AUDIT',json.dumps(v,sort_keys=True))
          if v.get('critical',0) != 0:
              raise SystemExit('critical vulnerabilities remain')
          PY
      - name: Commit verified hardening
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            mj-insight-vault-mvp/mj-insight-vault/package-lock.json \
            mj-insight-vault-mvp/mj-insight-vault/lib/chatAnalysisQualityGate.ts \
            mj-insight-vault-mvp/mj-insight-vault/lib/chatRouteFullCorpusGuard.ts
          git diff --cached --quiet && exit 0
          git commit -m 'chore: harden dependencies and clear lint warnings [hardening-done]'
          git push origin HEAD:chore/canonical-hardening-20260809
