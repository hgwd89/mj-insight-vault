name: canonical-migration-hole-sync

on:
  push:
    branches:
      - chore/canonical-migration-sync-20260809

permissions:
  contents: write

jobs:
  sync:
    if: ${{ !contains(github.event.head_commit.message, '[migration-sync-done]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch exact canonical migrations and verify Git blob SHAs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p supabase/migrations
          fetch_one() {
            rn="$1"
            path="$2"
            expected="$3"
            curl --fail --silent --show-error \
              'https://wqbjtvepnavkqdshppau.supabase.co/rest/v1/rpc/_mj_git_transfer_a7e6f19d?p_rn='"${rn}" \
              -H 'apikey: sb_publishable_Y0eb0AT-U8M0Ho-_LMEtCQ_gUMBLyD7' \
              | python3 -c 'import json,sys; s=json.load(sys.stdin); assert isinstance(s,str); sys.stdout.write(s)' \
              > "$path"
            actual="$(git hash-object "$path")"
            test "$actual" = "$expected" || { echo "SHA mismatch for $path: $actual != $expected" >&2; exit 1; }
          }
          fetch_one 71 'supabase/migrations/20260807082437_prepare_aaaa_formal_contract_v4.sql' '2bb2870f6e93b6515082050d2c7c146deaef5988'
          fetch_one 179 'supabase/migrations/20260807153628_add_all_seed_candidate_synthesis_and_mapping_v5.sql' '88ac8fef35848e334b66b3fd91d5d1ffb82c8367'
          fetch_one 293 'supabase/migrations/20260809010902_bind_verified_reports_to_user_query_and_chat_v15.sql' '23620da2b3b253b3c1a5f9b42b794d3d835ade63'
      - name: Commit exact migration blobs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            supabase/migrations/20260807082437_prepare_aaaa_formal_contract_v4.sql \
            supabase/migrations/20260807153628_add_all_seed_candidate_synthesis_and_mapping_v5.sql \
            supabase/migrations/20260809010902_bind_verified_reports_to_user_query_and_chat_v15.sql
          git diff --cached --quiet && exit 0
          git commit -m 'chore: sync canonical migration holes [migration-sync-done]'
          git push origin HEAD:chore/canonical-migration-sync-20260809
