name: dependency-audit-20260809

on:
  push:
    branches:
      - chore/canonical-verify-v2-20260809

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: mj-insight-vault-mvp/mj-insight-vault/package-lock.json
      - name: Install baseline dependencies
        working-directory: mj-insight-vault-mvp/mj-insight-vault
        run: npm ci
      - name: Simulate non-force audit fix and show version changes
        working-directory: mj-insight-vault-mvp/mj-insight-vault
        shell: bash
        run: |
          set -euo pipefail
          cp package-lock.json /tmp/package-lock.before.json
          npm audit fix --package-lock-only || true
          python3 - <<'PY'
          import json
          a=json.load(open('/tmp/package-lock.before.json'))
          b=json.load(open('package-lock.json'))
          ap=a.get('packages',{})
          bp=b.get('packages',{})
          changed=[]
          for k in sorted(set(ap)|set(bp)):
              av=(ap.get(k) or {}).get('version')
              bv=(bp.get(k) or {}).get('version')
              if av != bv:
                  changed.append((k,av,bv))
          print('LOCK_VERSION_CHANGES',len(changed))
          for k,av,bv in changed:
              print('LOCK_CHANGE',k or '<root>',str(av),'->',str(bv))
          PY
      - name: Install fixed lock dependencies
        working-directory: mj-insight-vault-mvp/mj-insight-vault
        run: npm ci
      - name: Summarize remaining full audit
        working-directory: mj-insight-vault-mvp/mj-insight-vault
        shell: bash
        run: |
          set -euo pipefail
          npm audit --json > /tmp/audit-full.json || true
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/audit-full.json'))
          print('AFTER_FULL_METADATA', json.dumps(d.get('metadata',{}), ensure_ascii=False, sort_keys=True))
          for name,v in sorted((d.get('vulnerabilities') or {}).items()):
              print('AFTER_FULL_VULN', name, 'severity='+str(v.get('severity')), 'direct='+str(v.get('isDirect')), 'range='+str(v.get('range')), 'fix='+json.dumps(v.get('fixAvailable'), sort_keys=True))
          PY
      - name: Summarize remaining production audit
        working-directory: mj-insight-vault-mvp/mj-insight-vault
        shell: bash
        run: |
          set -euo pipefail
          npm audit --omit=dev --json > /tmp/audit-prod.json || true
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/audit-prod.json'))
          print('AFTER_PROD_METADATA', json.dumps(d.get('metadata',{}), ensure_ascii=False, sort_keys=True))
          for name,v in sorted((d.get('vulnerabilities') or {}).items()):
              print('AFTER_PROD_VULN', name, 'severity='+str(v.get('severity')), 'direct='+str(v.get('isDirect')), 'range='+str(v.get('range')), 'fix='+json.dumps(v.get('fixAvailable'), sort_keys=True))
          PY
      - name: Regression tests after simulated fix
        working-directory: mj-insight-vault-mvp/mj-insight-vault
        run: npm run test:local
      - name: Lint after simulated fix
        working-directory: mj-insight-vault-mvp/mj-insight-vault
        run: npm run lint
      - name: Production build after simulated fix
        working-directory: mj-insight-vault-mvp/mj-insight-vault
        run: npm run build
