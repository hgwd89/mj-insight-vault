name: Diagnose E2E runtime secrets

on:
  push:
    branches: [main]
    paths:
      - '.github/trigger-e2e-runtime-secret-diagnostic'

jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
    steps:
      - name: Report secret availability only
        shell: bash
        run: |
          for name in OPENAI_API_KEY SUPABASE_SERVICE_ROLE_KEY NEXT_PUBLIC_SUPABASE_URL SUPABASE_URL APP_PASSWORD; do
            if [ -n "${!name:-}" ]; then
              echo "${name}=present"
            else
              echo "${name}=missing"
            fi
          done
