name: Fix inventory OCR block source

on:
  push:
    branches:
      - audit/verified-pipeline-v10-buildcheck

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/verified-pipeline-v10-buildcheck
          fetch-depth: 0
      - name: Align inventory worker with authoritative OCR block source
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('mj-insight-vault-mvp/mj-insight-vault/lib/articleInventoryWorker.ts')
          s = p.read_text()
          old = """  const { data, error } = await supabaseAdmin
    .from('source_page_article_inventory_blocks_v1')
    .select('block_index,block_text,x_min,y_min,x_max,y_max,ocr_confidence,source_ocr_json_sha256')
    .eq('job_id', job.id)
    .order('block_index', { ascending: true });"""
          new = """  const { data, error } = await supabaseAdmin
    .from('source_ocr_blocks_v1')
    .select('block_index,block_text,x_min,y_min,x_max,y_max,ocr_confidence,source_ocr_json_sha256')
    .eq('source_image_id', job.inventory_source_image_id)
    .eq('page_index', 0)
    .eq('source_ocr_json_sha256', job.source_ocr_json_sha256)
    .order('block_index', { ascending: true });"""
          if s.count(old) != 1:
              raise SystemExit(f'expected one loadBlocks source target, found {s.count(old)}')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mj-insight-vault-mvp/mj-insight-vault/lib/articleInventoryWorker.ts
          git diff --cached --check
          git commit -m 'fix inventory worker OCR block source [ocr-source-fix-done]'
          git push origin HEAD:audit/verified-pipeline-v10-buildcheck
