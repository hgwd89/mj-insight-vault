name: Inventory smoke one step

on:
  push:
    branches:
      - audit/verified-pipeline-v10-buildcheck
    paths:
      - '.github/workflows/inventory-smoke-one-step.yml'

permissions:
  contents: read

env:
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
  NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
  SMOKE_JOB_ID: 0b5b56fe-1e64-4cff-8432-eb48e9688e55
  SMOKE_RUN_REV: '6'

jobs:
  run:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mj-insight-vault-mvp/mj-insight-vault
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mj-insight-vault-mvp/mj-insight-vault/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Import inventory worker
        run: npx --yes tsx@4.20.3 -e "import('./lib/articleInventoryWorker.ts').then(() => console.log('worker_import=ok'))"
      - name: Run exactly one targeted inventory critic step
        shell: bash
        run: |
          set -euo pipefail
          npx --yes tsx@4.20.3 -e "(async()=>{const m=await import('./lib/articleInventoryWorker.ts');const fn=m.runArticleInventoryWorkerStep??m.default?.runArticleInventoryWorkerStep;if(typeof fn!=='function')throw new Error('worker export not found');const step=await fn(process.env.SMOKE_JOB_ID);const out={claimed:step?.claimed,stage:step?.stage,job_id:step?.job_id,yield_status:step?.yield?.status,completed_stage:step?.yield?.completed_stage};console.log(JSON.stringify(out));if(step?.job_id!==process.env.SMOKE_JOB_ID)throw new Error('unexpected job id');if(step?.stage!=='blind_critic')throw new Error('unexpected stage '+step?.stage);if(step?.yield?.status!=='queued')throw new Error('critic step did not yield queued')})().catch(e=>{const raw=String(e?.stack||e);const msg=raw.replace(/%/g,'%25').replace(/\r/g,'%0D').replace(/\n/g,'%0A');console.log('::error title=inventory_critic::'+msg);process.exit(1)})"
