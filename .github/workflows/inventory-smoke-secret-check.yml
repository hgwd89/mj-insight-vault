name: Inventory smoke secret check

on:
  push:
    branches:
      - audit/verified-pipeline-v10-buildcheck
    paths:
      - '.github/workflows/inventory-smoke-secret-check.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NODE_OPTIONS: --dns-result-order=ipv4first
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Required runtime secrets are valid enough to test
        shell: bash
        run: |
          set +e
          failed=0
          if [ -z "${OPENAI_API_KEY:-}" ]; then echo '::error title=runtime_secret::OPENAI_API_KEY missing'; failed=1; fi
          if [ -z "${SUPABASE_SERVICE_ROLE_KEY:-}" ]; then echo '::error title=runtime_secret::SUPABASE_SERVICE_ROLE_KEY missing'; failed=1; fi
          if [ -z "${NEXT_PUBLIC_SUPABASE_URL:-}" ]; then echo '::error title=runtime_secret::NEXT_PUBLIC_SUPABASE_URL missing'; failed=1; fi
          if [ "${NEXT_PUBLIC_SUPABASE_URL%/}" != 'https://wqbjtvepnavkqdshppau.supabase.co' ]; then echo '::error title=runtime_secret::NEXT_PUBLIC_SUPABASE_URL does not match active project'; failed=1; fi
          exit "$failed"
      - name: Authenticated Node fetch can read one inventory job
        shell: bash
        run: |
          node - <<'NODE'
          const base = process.env.NEXT_PUBLIC_SUPABASE_URL.replace(/\/$/, '');
          const key = process.env.SUPABASE_SERVICE_ROLE_KEY;
          const url = base + '/rest/v1/source_page_article_inventory_jobs_v1?select=id&limit=1';
          fetch(url, { headers: { apikey: key, authorization: `Bearer ${key}` } })
            .then(async (res) => {
              console.log(`authenticated_status=${res.status}`);
              if (!res.ok) {
                const text = (await res.text()).slice(0, 200).replace(/[^A-Za-z0-9 _.:/-]/g, '');
                console.log(`::error title=supabase_authenticated_status::HTTP ${res.status} ${text}`);
                process.exit(1);
              }
              const data = await res.json();
              if (!Array.isArray(data)) process.exit(1);
              console.log(`authenticated_rows=${data.length}`);
            })
            .catch((e) => {
              const raw = String(e?.cause?.code || e?.cause?.message || e?.message || e);
              const msg = raw.replace(/%/g, '%25').replace(/\r/g, '%0D').replace(/\n/g, '%0A');
              console.log('::error title=supabase_authenticated_fetch::' + msg);
              process.exit(1);
            });
          NODE
