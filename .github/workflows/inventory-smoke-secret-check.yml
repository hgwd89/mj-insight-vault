name: Inventory smoke secret check

on:
  push:
    branches:
      - audit/verified-pipeline-v10-buildcheck
    paths:
      - '.github/workflows/inventory-smoke-secret-check.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
    steps:
      - name: OPENAI_API_KEY present
        continue-on-error: true
        shell: bash
        run: test -n "$OPENAI_API_KEY"
      - name: SUPABASE_SERVICE_ROLE_KEY present
        continue-on-error: true
        shell: bash
        run: test -n "$SUPABASE_SERVICE_ROLE_KEY"
      - name: NEXT_PUBLIC_SUPABASE_URL present
        continue-on-error: true
        shell: bash
        run: test -n "$NEXT_PUBLIC_SUPABASE_URL"
      - name: SUPABASE_URL present
        continue-on-error: true
        shell: bash
        run: test -n "$SUPABASE_URL"
      - name: NEXT_PUBLIC_SUPABASE_URL matches active project
        continue-on-error: true
        shell: bash
        run: test "${NEXT_PUBLIC_SUPABASE_URL%/}" = 'https://wqbjtvepnavkqdshppau.supabase.co'
      - name: SUPABASE_URL matches active project
        continue-on-error: true
        shell: bash
        run: test "${SUPABASE_URL%/}" = 'https://wqbjtvepnavkqdshppau.supabase.co'
