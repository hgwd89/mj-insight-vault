name: Inventory smoke secret check

on:
  push:
    branches:
      - audit/verified-pipeline-v10-buildcheck
    paths:
      - '.github/workflows/inventory-smoke-secret-check.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: OPENAI_API_KEY present
        continue-on-error: true
        shell: bash
        run: test -n "$OPENAI_API_KEY"
      - name: SUPABASE_SERVICE_ROLE_KEY present
        continue-on-error: true
        shell: bash
        run: test -n "$SUPABASE_SERVICE_ROLE_KEY"
      - name: NEXT_PUBLIC_SUPABASE_URL present
        continue-on-error: true
        shell: bash
        run: test -n "$NEXT_PUBLIC_SUPABASE_URL"
      - name: SUPABASE_URL present
        continue-on-error: true
        shell: bash
        run: test -n "$SUPABASE_URL"
      - name: NEXT_PUBLIC_SUPABASE_URL matches active project
        continue-on-error: true
        shell: bash
        run: test "${NEXT_PUBLIC_SUPABASE_URL%/}" = 'https://wqbjtvepnavkqdshppau.supabase.co'
      - name: SUPABASE_URL matches active project
        continue-on-error: true
        shell: bash
        run: test "${SUPABASE_URL%/}" = 'https://wqbjtvepnavkqdshppau.supabase.co'
      - name: curl can reach Supabase host
        continue-on-error: true
        shell: bash
        run: curl --connect-timeout 10 --max-time 20 --silent --show-error --output /dev/null "${NEXT_PUBLIC_SUPABASE_URL%/}/rest/v1/"
      - name: Node fetch can reach Supabase host
        continue-on-error: true
        shell: bash
        run: |
          node - <<'NODE'
          fetch(process.env.NEXT_PUBLIC_SUPABASE_URL.replace(/\/$/, '') + '/rest/v1/')
            .then(() => process.exit(0))
            .catch((e) => {
              const raw = String(e?.cause?.code || e?.cause?.message || e?.message || e);
              const msg = raw.replace(/%/g, '%25').replace(/\r/g, '%0D').replace(/\n/g, '%0A');
              console.log('::error title=supabase_node_fetch::' + msg);
              process.exit(1);
            });
          NODE
      - name: Node fetch IPv4-first can reach Supabase host
        continue-on-error: true
        shell: bash
        env:
          NODE_OPTIONS: --dns-result-order=ipv4first
        run: node -e "fetch(process.env.NEXT_PUBLIC_SUPABASE_URL.replace(/\/$/,'')+'/rest/v1/').then(()=>process.exit(0)).catch(()=>process.exit(1))"
