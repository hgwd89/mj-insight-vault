name: inventory-v6-runtime-capability

on:
  push:
    branches:
      - agent/inventory-smoke-v2
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: Report capability flags only
        shell: bash
        run: |
          test -n "$OPENAI_API_KEY" && OPENAI=yes || OPENAI=no
          test -n "$NEXT_PUBLIC_SUPABASE_URL" && URL=yes || URL=no
          test -n "$SUPABASE_SERVICE_ROLE_KEY" && SERVICE=yes || SERVICE=no
          echo "openai_secret_present=$OPENAI"
          echo "supabase_url_present=$URL"
          echo "supabase_service_role_present=$SERVICE"
          if [ "$OPENAI" = yes ] && [ "$URL" = yes ] && [ "$SERVICE" = yes ]; then
            echo "runtime_capable=yes"
          else
            echo "runtime_capable=no"
          fi
