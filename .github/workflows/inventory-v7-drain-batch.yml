name: Inventory V7 drain batch

on:
  push:
    branches:
      - agent/inventory-smoke-v2
    paths:
      - '.github/workflows/inventory-v7-drain-batch.yml'

permissions:
  contents: read

env:
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
  NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
  NODE_OPTIONS: --dns-result-order=ipv4first

jobs:
  drain:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mj-insight-vault-mvp/mj-insight-vault
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mj-insight-vault-mvp/mj-insight-vault/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Drain bounded Inventory V7 batch
        shell: bash
        run: |
          set -euo pipefail
          npx --yes tsx@4.20.3 -e "(async()=>{const m=await import('./lib/articleInventoryWorkerV7GroundedOrchestrator.ts');const fn=m.runArticleInventoryWorkerV7GroundedOrchestratorStep;if(typeof fn!=='function')throw new Error('V7 worker export not found');const workers=8,stepsPerLane=2;const lanes=await Promise.all(Array.from({length:workers},async(_,lane)=>{const out=[];for(let i=0;i<stepsPerLane;i++){const r=await fn();out.push({lane:lane+1,i:i+1,claimed:r?.claimed,stage:r?.stage,job_id:r?.job_id,yield_status:r?.yield?.status,completed_stage:r?.yield?.completed_stage});if(Number(r?.claimed||0)<1)break;}return out;}));const flat=lanes.flat();console.log(JSON.stringify({workers,steps_per_lane:stepsPerLane,steps:flat},null,2));})().catch(e=>{console.error(e?.stack||e);process.exit(1)})"
