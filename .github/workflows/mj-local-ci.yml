name: MJ Local CI

on:
  push:
    branches:
      - main
    paths:
      - 'mj-insight-vault-mvp/mj-insight-vault/**'
      - 'mj-insight-vault-mvp/vercel.json'
      - '.github/workflows/**'
  pull_request:
    branches:
      - main
    paths:
      - 'mj-insight-vault-mvp/mj-insight-vault/**'
      - 'mj-insight-vault-mvp/vercel.json'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: mj-insight-vault-mvp/mj-insight-vault

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Guard repository deployment invariants
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail

          token_key='VERCEL_''TOKEN'
          cli_pattern='vercel[[:space:]]+(pull|build|deploy)'
          if git grep -n -E "${token_key}|${cli_pattern}" -- .github/workflows; then
            echo 'Vercel CLI/token deployment logic must not be reintroduced into GitHub Actions; Vercel Git Integration owns deployment.' >&2
            exit 1
          fi

          node - <<'NODE'
          const fs = require('fs');
          const path = 'mj-insight-vault-mvp/vercel.json';
          const config = JSON.parse(fs.readFileSync(path, 'utf8'));
          if (config?.git?.deploymentEnabled !== false) {
            console.error('Legacy Vercel project must remain disabled via mj-insight-vault-mvp/vercel.json.');
            process.exit(1);
          }
          NODE

          stale=()
          while IFS= read -r path; do
            [ -n "$path" ] && stale+=("$path")
          done < <(
            find .github/workflows -maxdepth 1 -type f \( -name 'apply-*.yml' -o -name 'retry-vercel-rate-limit.yml' -o -name 'diagnose-e2e-runtime-secrets.yml' \) -print
            find .github -maxdepth 1 -type f -name 'trigger-*' -print
            find . -maxdepth 1 -type f -name '.vercel-redeploy*' -print
            if [ -d scripts ]; then
              find scripts -maxdepth 1 -type f \( -name 'patch_*.py' -o -name 'fix_semantic_patch_*.py' -o -name 'add_*marker*.py' \) -print
            fi
          )
          if [ "${#stale[@]}" -ne 0 ]; then
            printf 'Stale deployment/patch scaffolding is forbidden:\n%s\n' "${stale[@]}" >&2
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mj-insight-vault-mvp/mj-insight-vault/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=moderate

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mj-insight-vault-mvp/mj-insight-vault/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  test-local:
    name: test-local
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mj-insight-vault-mvp/mj-insight-vault/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run local tests
        shell: bash
        run: |
          set -o pipefail
          npm run test:local 2>&1 | tee test-local.log

      - name: Upload local test failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-local-failure-log
          path: mj-insight-vault-mvp/mj-insight-vault/test-local.log
          if-no-files-found: error
          retention-days: 3

