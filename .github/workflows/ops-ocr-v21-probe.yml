name: OCR V21 DB Probe

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/ops-ocr-v21-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch read-only Supabase probe
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            --max-time 30 \
            'https://wqbjtvepnavkqdshppau.supabase.co/functions/v1/ocr-v21-db-probe-20260826' \
            | tee probe.json
          python -m json.tool probe.json >/dev/null
      - name: Upload probe result
        uses: actions/upload-artifact@v4
        with:
          name: ocr-v21-db-probe
          path: probe.json
          retention-days: 1
