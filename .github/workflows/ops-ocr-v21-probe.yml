name: OCR V21 DB Probe

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/ops-ocr-v21-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch read-only Supabase probe
        id: probe
        shell: bash
        run: |
          set +e
          status=$(curl --silent --show-error \
            --max-time 35 \
            --output probe.json \
            --write-out '%{http_code}' \
            'https://wqbjtvepnavkqdshppau.supabase.co/functions/v1/ocr-v21-db-probe-20260826')
          curl_exit=$?
          echo "http_status=${status}" > probe-meta.txt
          echo "curl_exit=${curl_exit}" >> probe-meta.txt
          if [ -s probe.json ]; then
            python -m json.tool probe.json >/dev/null || true
          fi
          exit 0
      - name: Upload probe result
        uses: actions/upload-artifact@v4
        with:
          name: ocr-v21-db-probe
          path: |
            probe.json
            probe-meta.txt
          retention-days: 1
