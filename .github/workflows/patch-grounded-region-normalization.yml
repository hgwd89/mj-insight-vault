name: patch-grounded-region-normalization

on:
  push:
    branches:
      - agent/inventory-smoke-v2
    paths:
      - .github/workflows/patch-grounded-region-normalization.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/inventory-smoke-v2
          fetch-depth: 0
      - name: Normalize grounded visual rectangles
        shell: python
        run: |
          from pathlib import Path

          v6 = Path('mj-insight-vault-mvp/mj-insight-vault/lib/articleInventoryWorkerV6Grounded.ts')
          text = v6.read_text()
          old = """    const regions = item.regions.map((rawRegion, regionIndex) => {\n      const r = record(rawRegion); const value = { x_min: Number(r.x_min), y_min: Number(r.y_min), x_max: Number(r.x_max), y_max: Number(r.y_max) };\n      if (!Object.values(value).every(Number.isInteger) || value.x_min < 0 || value.y_min < 0 || value.x_max > 1000 || value.y_max > 1000 || value.x_max <= value.x_min || value.y_max <= value.y_min) {\n        throw new ReviewRequiredError(`Visual article ${articleIndex} region ${regionIndex} invalid.`);\n      }\n      return value;\n    });"""
          new = """    const regions = item.regions.map((rawRegion, regionIndex) => {\n      const r = record(rawRegion);\n      const rawValue = { x_min: Number(r.x_min), y_min: Number(r.y_min), x_max: Number(r.x_max), y_max: Number(r.y_max) };\n      if (!Object.values(rawValue).every(Number.isInteger) || rawValue.x_min < 0 || rawValue.y_min < 0 || rawValue.x_max > 1000 || rawValue.y_max > 1000) {\n        throw new ReviewRequiredError(`Visual article ${articleIndex} region ${regionIndex} invalid.`);\n      }\n      let xMin = Math.min(rawValue.x_min, rawValue.x_max);\n      let xMax = Math.max(rawValue.x_min, rawValue.x_max);\n      let yMin = Math.min(rawValue.y_min, rawValue.y_max);\n      let yMax = Math.max(rawValue.y_min, rawValue.y_max);\n      if (xMax === xMin) { if (xMax < 1000) xMax += 1; else xMin -= 1; }\n      if (yMax === yMin) { if (yMax < 1000) yMax += 1; else yMin -= 1; }\n      return { x_min: xMin, y_min: yMin, x_max: xMax, y_max: yMax };\n    });"""
          if old not in text:
              raise SystemExit('V6 target block not found')
          v6.write_text(text.replace(old, new, 1))

          v7 = Path('mj-insight-vault-mvp/mj-insight-vault/lib/articleInventoryWorkerV7GroundedOrchestrator.ts')
          text = v7.read_text()
          old = """    const regions = item.regions.map((rr, j) => {\n      const r = record(rr); const v = { x_min: Number(r.x_min), y_min: Number(r.y_min), x_max: Number(r.x_max), y_max: Number(r.y_max) };\n      if (!Object.values(v).every(Number.isInteger) || v.x_min < 0 || v.y_min < 0 || v.x_max > 1000 || v.y_max > 1000 || v.x_max <= v.x_min || v.y_max <= v.y_min) {\n        throw new ReviewRequiredError(`Grounded adjudicator article ${i} region ${j} invalid.`);\n      }\n      return v;\n    });"""
          new = """    const regions = item.regions.map((rr, j) => {\n      const r = record(rr);\n      const rawValue = { x_min: Number(r.x_min), y_min: Number(r.y_min), x_max: Number(r.x_max), y_max: Number(r.y_max) };\n      if (!Object.values(rawValue).every(Number.isInteger) || rawValue.x_min < 0 || rawValue.y_min < 0 || rawValue.x_max > 1000 || rawValue.y_max > 1000) {\n        throw new ReviewRequiredError(`Grounded adjudicator article ${i} region ${j} invalid.`);\n      }\n      let xMin = Math.min(rawValue.x_min, rawValue.x_max);\n      let xMax = Math.max(rawValue.x_min, rawValue.x_max);\n      let yMin = Math.min(rawValue.y_min, rawValue.y_max);\n      let yMax = Math.max(rawValue.y_min, rawValue.y_max);\n      if (xMax === xMin) { if (xMax < 1000) xMax += 1; else xMin -= 1; }\n      if (yMax === yMin) { if (yMax < 1000) yMax += 1; else yMin -= 1; }\n      return { x_min: xMin, y_min: yMin, x_max: xMax, y_max: yMax };\n    });"""
          if old not in text:
              raise SystemExit('V7 target block not found')
          v7.write_text(text.replace(old, new, 1))

          Path('.github/workflows/patch-grounded-region-normalization.yml').unlink()
      - name: Commit one-shot patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "normalize grounded visual region coordinates"
          git push origin HEAD:agent/inventory-smoke-v2
