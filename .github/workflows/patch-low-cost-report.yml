name: Patch low-cost report pipeline

on:
  push:
    branches:
      - fix/uuid-loader-and-low-cost-report

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/uuid-loader-and-low-cost-report
          fetch-depth: 0
      - name: Apply focused patch
        run: |
          python - <<'PY'
          from pathlib import Path

          scan = Path('mj-insight-vault-mvp/mj-insight-vault/lib/fullCorpusScan.ts')
          text = scan.read_text()
          old = """function evidenceIdsFromSummary(summary: JsonRecord, fallbackIds: string[]) {
            const ids = new Set<string>();
            const evidence = Array.isArray(summary.evidence) ? summary.evidence : [];
            for (const item of evidence) {
              if (isRecord(item)) {
                const id = text(item.article_id || item.id);
                if (id) ids.add(id);
              }
            }
            for (const id of fallbackIds.slice(0, 10)) ids.add(id);
            return Array.from(ids);
          }
          """
          new = """function evidenceIdsFromSummary(summary: JsonRecord, fallbackIds: string[]) {
            const allowedIds = new Set(fallbackIds);
            const ids = new Set<string>();
            const evidence = Array.isArray(summary.evidence) ? summary.evidence : [];
            for (const item of evidence) {
              if (isRecord(item)) {
                const id = text(item.article_id || item.id);
                if (allowedIds.has(id)) ids.add(id);
              }
            }
            for (const id of fallbackIds.slice(0, 10)) ids.add(id);
            return Array.from(ids);
          }
          """
          if old not in text:
              raise SystemExit('evidenceIdsFromSummary target not found')
          text = text.replace(old, new, 1)
          text = text.replace("FULL_CORPUS_PROMPT_VERSION = 'full_corpus_batch_v1'", "FULL_CORPUS_PROMPT_VERSION = 'full_corpus_batch_v2'", 1)
          text = text.replace(".slice(0, 6000)", ".slice(0, 4000)", 1)
          scan.write_text(text)

          panel = Path('mj-insight-vault-mvp/mj-insight-vault/components/ReportJobPanel.tsx')
          panel_text = panel.read_text()
          panel_text = panel_text.replace("useState('gpt-5-mini')", "useState('gpt-4o-mini')", 1)
          panel.write_text(panel_text)

          verify = Path('mj-insight-vault-mvp/mj-insight-vault/scripts/verify-report-pipeline.mjs')
          verify_text = verify.read_text()
          verify_text = verify_text.replace("assertIncludes(panel, \"useState('gpt-5-mini')\", 'report UI must not default to the most expensive model');", "assertIncludes(panel, \"useState('gpt-4o-mini')\", 'report UI must default to the low-cost model');", 1)
          marker = "assertExcludes(scan, 'fallbackBatchSummary', 'provider failures must not be saved as fake analysis results');"
          addition = marker + "\nassertIncludes(scan, 'allowedIds.has(id)', 'model-supplied evidence IDs must be restricted to the current batch');\nassertIncludes(scan, \"full_corpus_batch_v2\", 'prompt version must invalidate unsafe prior runs');\nassertIncludes(scan, '.slice(0, 4000)', 'scan article input must use the low-cost text budget');"
          if marker not in verify_text:
              raise SystemExit('verification marker not found')
          verify_text = verify_text.replace(marker, addition, 1)
          verify.write_text(verify_text)

          Path('.github/workflows/patch-low-cost-report.yml').unlink()
          PY
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "sanitize evidence ids and lower report cost"
          git push origin HEAD:fix/uuid-loader-and-low-cost-report
