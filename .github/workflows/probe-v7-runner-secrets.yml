name: probe-v7-runner-secrets

on:
  push:
    branches: [agent/inventory-smoke-v2]
    paths: [.github/workflows/probe-v7-runner-secrets.yml]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
    steps:
      - name: Check required secret presence without revealing values
        shell: bash
        run: |
          missing=0
          if [ -z "$OPENAI_API_KEY" ]; then echo "OPENAI_API_KEY=missing"; missing=1; else echo "OPENAI_API_KEY=present"; fi
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then echo "SUPABASE_SERVICE_ROLE_KEY=missing"; missing=1; else echo "SUPABASE_SERVICE_ROLE_KEY=present"; fi
          if [ -z "$NEXT_PUBLIC_SUPABASE_URL" ] && [ -z "$SUPABASE_URL" ]; then echo "SUPABASE_URL=missing"; missing=1; else echo "SUPABASE_URL=present"; fi
          exit "$missing"
