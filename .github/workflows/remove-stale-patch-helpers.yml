name: Remove stale patch helpers

on:
  push:
    branches:
      - cleanup/remove-stale-patch-helpers
    paths:
      - '.github/workflows/remove-stale-patch-helpers.yml'

permissions:
  contents: write

jobs:
  validate-remove-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout cleanup branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: cleanup/remove-stale-patch-helpers

      - name: Verify helpers exist and have no active references
        shell: bash
        run: |
          set -euo pipefail
          targets=(
            scripts/add_direct_writer_static_marker.py
            scripts/add_formal_stop_cleanup.py
            scripts/add_hierarchical_legacy_markers.py
            scripts/add_staged_writer_legacy_json_marker.py
            scripts/fix_semantic_patch_escaping.py
            scripts/fix_semantic_patch_test_variable.py
            scripts/fix_semantic_patch_types.py
          )
          for path in "${targets[@]}"; do
            test -f "$path" || { echo "missing expected stale helper: $path" >&2; exit 1; }
            base="$(basename "$path")"
            matches="$(git grep -n -F "$base" -- . ':!scripts/**' ':!.github/workflows/remove-stale-patch-helpers.yml' ':!*.md' || true)"
            if [ -n "$matches" ]; then
              echo "$matches"
              echo "active reference found for $base; refusing removal" >&2
              exit 1
            fi
          done

      - name: Remove exactly the historical patch helpers
        shell: bash
        run: |
          rm \
            scripts/add_direct_writer_static_marker.py \
            scripts/add_formal_stop_cleanup.py \
            scripts/add_hierarchical_legacy_markers.py \
            scripts/add_staged_writer_legacy_json_marker.py \
            scripts/fix_semantic_patch_escaping.py \
            scripts/fix_semantic_patch_test_variable.py \
            scripts/fix_semantic_patch_types.py

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mj-insight-vault-mvp/mj-insight-vault/package-lock.json

      - name: Install exact dependencies
        working-directory: mj-insight-vault-mvp/mj-insight-vault
        run: npm ci

      - name: Production dependency audit
        working-directory: mj-insight-vault-mvp/mj-insight-vault
        run: npm audit --omit=dev --audit-level=moderate

      - name: Lint
        working-directory: mj-insight-vault-mvp/mj-insight-vault
        run: npm run lint

      - name: Local regression suite
        working-directory: mj-insight-vault-mvp/mj-insight-vault
        run: npm run test:local

      - name: Production build
        working-directory: mj-insight-vault-mvp/mj-insight-vault
        run: npm run build

      - name: Assert exact deletion scope
        shell: bash
        run: |
          python3 - <<'PY'
          import subprocess
          expected = {
              'scripts/add_direct_writer_static_marker.py',
              'scripts/add_formal_stop_cleanup.py',
              'scripts/add_hierarchical_legacy_markers.py',
              'scripts/add_staged_writer_legacy_json_marker.py',
              'scripts/fix_semantic_patch_escaping.py',
              'scripts/fix_semantic_patch_test_variable.py',
              'scripts/fix_semantic_patch_types.py',
          }
          rows = subprocess.check_output(['git', 'diff', '--name-status'], text=True).splitlines()
          changed = {}
          for row in rows:
              status, path = row.split('\t', 1)
              changed[path] = status
          print('CHANGED=' + ','.join(f'{changed[p]}:{p}' for p in sorted(changed)))
          if set(changed) != expected or any(status != 'D' for status in changed.values()):
              raise SystemExit(f'unexpected deletion scope: {changed}')
          PY

      - name: Commit verified cleanup
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts
          git diff --cached --quiet && exit 1
          git commit -m 'Remove stale patch helper scripts'
          git push origin HEAD:cleanup/remove-stale-patch-helpers
