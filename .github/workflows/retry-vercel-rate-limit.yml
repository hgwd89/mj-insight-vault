name: Retry Vercel after build rate limit

on:
  workflow_dispatch:

permissions:
  contents: read
  statuses: read

jobs:
  retry:
    runs-on: ubuntu-latest
    steps:
      - name: Disabled automatic retry
        run: |
          echo "Automatic Vercel retry is disabled to avoid exhausting deployment quotas."
          echo "After the Vercel deployment quota resets, deploy the latest main commit explicitly."
