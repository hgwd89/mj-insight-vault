name: runtime-secret-probe

on:
  push:
    branches: [codex/full-corpus-report-production]
    paths:
      - .github/workflows/runtime-secret-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Probe secret presence only
        shell: bash
        run: |
          for name in OPENAI_API_KEY SUPABASE_SERVICE_ROLE_KEY NEXT_PUBLIC_SUPABASE_URL VERCEL_TOKEN; do
            if [ -n "${!name}" ]; then echo "$name=set"; else echo "$name=unset"; fi
          done
