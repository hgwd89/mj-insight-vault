name: Simulate current Next 16 security upgrade

on:
  push:
    branches:
      - security/next16-current-sim
    paths:
      - '.github/workflows/simulate-next16-current.yml'

permissions:
  contents: read

defaults:
  run:
    working-directory: mj-insight-vault-mvp/mj-insight-vault

jobs:
  simulate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mj-insight-vault-mvp/mj-insight-vault/package-lock.json

      - name: Set migration ranges transiently
        run: |
          npm pkg set dependencies.next='^16.3.1'
          npm pkg set dependencies.sharp='^0.35.3'
          npm pkg set devDependencies.eslint-config-next='^16.3.1'

      - name: Install migrated dependency graph
        run: npm install

      - name: Replace ESLint config with Next 16 flat config transiently
        shell: bash
        run: |
          cat > scripts/eslint.config.mjs <<'EOF'
          import { defineConfig, globalIgnores } from 'eslint/config';
          import nextVitals from 'eslint-config-next/core-web-vitals';
          import nextTs from 'eslint-config-next/typescript';

          export default defineConfig([
            ...nextVitals,
            ...nextTs,
            {
              rules: {
                'react-hooks/set-state-in-effect': 'off'
              }
            },
            globalIgnores([
              '.next/**',
              'out/**',
              'build/**',
              'node_modules/**',
              'next-env.d.ts',
              'tsconfig.tsbuildinfo'
            ])
          ]);
          EOF

      - name: Show resolved framework stack
        run: npm ls next eslint-config-next sharp postcss

      - name: Audit production dependencies
        shell: bash
        run: |
          npm audit --omit=dev --json > /tmp/audit-prod.json || true
          node - <<'NODE'
          const fs = require('fs');
          const a = JSON.parse(fs.readFileSync('/tmp/audit-prod.json', 'utf8'));
          console.log('NEXT16_AUDIT=' + JSON.stringify(a.metadata?.vulnerabilities || {}));
          for (const [name, v] of Object.entries(a.vulnerabilities || {})) {
            console.log('NEXT16_VULNERABILITY=' + JSON.stringify({name,severity:v.severity,isDirect:v.isDirect,range:v.range,fixAvailable:v.fixAvailable}));
          }
          NODE

      - name: Lint
        run: npm run lint

      - name: Local regression suite
        run: npm run test:local

      - name: Production build
        run: npm run build
