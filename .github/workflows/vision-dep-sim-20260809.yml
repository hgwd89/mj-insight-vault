name: vision-dep-sim-20260809

on:
  push:
    branches:
      - chore/vision-dep-sim-20260809

permissions:
  contents: read

jobs:
  simulate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: mj-insight-vault-mvp/mj-insight-vault/package-lock.json
      - name: Inspect and simulate latest Vision SDK
        working-directory: mj-insight-vault-mvp/mj-insight-vault
        shell: bash
        run: |
          set -euo pipefail
          echo "VISION_LATEST $(npm view @google-cloud/vision version)"
          echo "VISION_BASELINE $(node -e \"console.log(require('./package-lock.json').packages['node_modules/@google-cloud/vision']?.version || 'missing')\")"
          npm install @google-cloud/vision@latest --package-lock-only --ignore-scripts
          echo "VISION_SIMULATED $(node -e \"console.log(require('./package-lock.json').packages['node_modules/@google-cloud/vision']?.version || 'missing')\")"
      - name: Install simulated dependencies
        working-directory: mj-insight-vault-mvp/mj-insight-vault
        run: npm ci
      - name: Regression tests
        working-directory: mj-insight-vault-mvp/mj-insight-vault
        run: npm run test:local
      - name: Zero-warning lint
        working-directory: mj-insight-vault-mvp/mj-insight-vault
        run: npm run lint -- --max-warnings=0
      - name: Production build
        working-directory: mj-insight-vault-mvp/mj-insight-vault
        run: npm run build
      - name: Audit production dependency graph
        working-directory: mj-insight-vault-mvp/mj-insight-vault
        shell: bash
        run: |
          set -euo pipefail
          npm audit --omit=dev --json > /tmp/audit.json || true
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/audit.json'))
          print('VISION_SIM_PROD_AUDIT',json.dumps(d.get('metadata',{}).get('vulnerabilities',{}),sort_keys=True))
          for n,v in sorted((d.get('vulnerabilities') or {}).items()):
              print('VISION_SIM_VULN',n,'severity='+str(v.get('severity')),'direct='+str(v.get('isDirect')),'range='+str(v.get('range')),'fix='+json.dumps(v.get('fixAvailable'),sort_keys=True))
          PY
      - name: Show package changes
        working-directory: mj-insight-vault-mvp/mj-insight-vault
        shell: bash
        run: |
          git diff -- package.json package-lock.json || true
